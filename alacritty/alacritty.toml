general.import = [
    "~/.config/alacritty/themes-pack/themes/dracula_plus.toml"
]

[font]
normal = { family = "Roboto Mono", style = "Regular" }
bold = { family = "Roboto Mono", style = "Bold" }
italic = { family = "Roboto Mono", style = "Italic" }
bold_italic = { family = "Roboto Mono", style = "Bold Italic" }
size = 16
offset = { x = 1, y = 1 }

[window]
# Option sends Meta (M-w, M-b, M-f, ...) instead of composing ∑, ∫, ƒ.
option_as_alt = "Both"

[cursor]
style = { blinking = "Always" }

[keyboard]
bindings = [
  { key = "Y", mods = "Control", action = "Paste" },
  # C-n / C-p go through as-is; tmux turns them into Down/Up outside Emacs.
  { key = "Slash", mods = "Control", chars = "\u001f" },
  # Emacs chords with no plain-byte form: send CSI u so tmux (extended-keys)
  # can forward them to `emacsclient -t'. Replaces C-=/C-- font zoom (Cmd+=/- still work).
  { key = "'", mods = "Control", chars = "\u001b[39;5u" },
  { key = ";", mods = "Control", chars = "\u001b[59;5u" },
  { key = ".", mods = "Control", chars = "\u001b[46;5u" },
  { key = ",", mods = "Control", chars = "\u001b[44;5u" },
  { key = "=", mods = "Control", chars = "\u001b[61;5u" },
  { key = "-", mods = "Control", chars = "\u001b[45;5u" },
  # C-<tab> (hideshow `toggle-fold') would otherwise be a bare TAB.
  { key = "Tab", mods = "Control", chars = "\u001b[9;5u" },
  # C-RET / C-S-RET (org: insert heading / TODO heading) would otherwise be a bare CR.
  { key = "Enter", mods = "Control", chars = "\u001b[13;5u" },
  { key = "Enter", mods = "Control|Shift", chars = "\u001b[13;6u" },
  # M-RET / M-S-RET (org: meta-return / insert TODO heading). Cmd is Meta, so
  # Cmd+Enter is ESC CR like Option+Enter; tmux would drop Shift from ESC CR,
  # so M-S-RET goes out as CSI u (decoded in init-keybindings.el).
  { key = "Enter", mods = "Command", chars = "\u001b\r" },
  { key = "Enter", mods = "Command|Shift", chars = "\u001b[13;4u" },
  { key = "Enter", mods = "Alt|Shift", chars = "\u001b[13;4u" },
  # Cmd is Meta, as in GUI Emacs (mac-command-modifier 'meta): Cmd+<letter> sends
  # ESC <letter>. Overrides Alacritty's Cmd+W/C/V/N/F/... defaults; Cmd+Q still quits.
  { key = "A", mods = "Command", chars = "\u001ba" },
  { key = "B", mods = "Command", chars = "\u001bb" },
  { key = "C", mods = "Command", chars = "\u001bc" },
  { key = "D", mods = "Command", chars = "\u001bd" },
  { key = "E", mods = "Command", chars = "\u001be" },
  { key = "F", mods = "Command", chars = "\u001bf" },
  { key = "G", mods = "Command", chars = "\u001bg" },
  { key = "H", mods = "Command", chars = "\u001bh" },
  { key = "I", mods = "Command", chars = "\u001bi" },
  { key = "J", mods = "Command", chars = "\u001bj" },
  { key = "K", mods = "Command", chars = "\u001bk" },
  { key = "L", mods = "Command", chars = "\u001bl" },
  { key = "M", mods = "Command", chars = "\u001bm" },
  { key = "N", mods = "Command", chars = "\u001bn" },
  { key = "O", mods = "Command", chars = "\u001bo" },
  { key = "P", mods = "Command", chars = "\u001bp" },
  { key = "R", mods = "Command", chars = "\u001br" },
  { key = "S", mods = "Command", chars = "\u001bs" },
  { key = "T", mods = "Command", chars = "\u001bt" },
  { key = "U", mods = "Command", chars = "\u001bu" },
  { key = "V", mods = "Command", chars = "\u001bv" },
  { key = "W", mods = "Command", chars = "\u001bw" },
  { key = "X", mods = "Command", chars = "\u001bx" },
  { key = "Y", mods = "Command", chars = "\u001by" },
  { key = "Z", mods = "Command", chars = "\u001bz" },
  # Cmd+Ctrl is C-M-, completing Cmd-as-Meta: Cmd+Ctrl+<letter> sends ESC <C-letter>.
  # Without these Alacritty drops Cmd and sends a bare C-<letter>. Skips Q
  # (macOS lock screen); F replaces Alacritty's fullscreen toggle.
  { key = "A", mods = "Command|Control", chars = "\u001b\u0001" },
  { key = "B", mods = "Command|Control", chars = "\u001b\u0002" },
  { key = "C", mods = "Command|Control", chars = "\u001b\u0003" },
  { key = "D", mods = "Command|Control", chars = "\u001b\u0004" },
  { key = "E", mods = "Command|Control", chars = "\u001b\u0005" },
  { key = "F", mods = "Command|Control", chars = "\u001b\u0006" },
  { key = "G", mods = "Command|Control", chars = "\u001b\u0007" },
  { key = "H", mods = "Command|Control", chars = "\u001b\u0008" },
  { key = "I", mods = "Command|Control", chars = "\u001b\u0009" },
  { key = "J", mods = "Command|Control", chars = "\u001b\u000a" },
  { key = "K", mods = "Command|Control", chars = "\u001b\u000b" },
  { key = "L", mods = "Command|Control", chars = "\u001b\u000c" },
  { key = "M", mods = "Command|Control", chars = "\u001b\u000d" },
  { key = "N", mods = "Command|Control", chars = "\u001b\u000e" },
  { key = "O", mods = "Command|Control", chars = "\u001b\u000f" },
  { key = "P", mods = "Command|Control", chars = "\u001b\u0010" },
  { key = "R", mods = "Command|Control", chars = "\u001b\u0012" },
  { key = "S", mods = "Command|Control", chars = "\u001b\u0013" },
  { key = "T", mods = "Command|Control", chars = "\u001b\u0014" },
  { key = "U", mods = "Command|Control", chars = "\u001b\u0015" },
  { key = "V", mods = "Command|Control", chars = "\u001b\u0016" },
  { key = "W", mods = "Command|Control", chars = "\u001b\u0017" },
  { key = "X", mods = "Command|Control", chars = "\u001b\u0018" },
  { key = "Y", mods = "Command|Control", chars = "\u001b\u0019" },
  { key = "Z", mods = "Command|Control", chars = "\u001b\u001a" },
  # Alacritty matches the shifted character, so Cmd+Shift+, arrives as "<".
  { key = "<", mods = "Command|Shift", chars = "\u001b<" },
  { key = ">", mods = "Command|Shift", chars = "\u001b>" },
  { key = ",", mods = "Command|Shift", chars = "\u001b<" },
  { key = ".", mods = "Command|Shift", chars = "\u001b>" },
  { key = "/", mods = "Command", chars = "\u001b/" },
  { key = ";", mods = "Command", chars = "\u001b;" },
]
